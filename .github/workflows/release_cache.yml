name: Release Cache ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Téléchargement du cache depuis Google Drive
        run: |
          echo "📥 Téléchargement des modèles..."
          mkdir -p cache
          rclone sync gdrive:GOANGEL/cache ./cache --progress
          du -sh cache/

      - name: Création de l'archive ZIP unique
        run: |
          echo "📦 Compression en un seul fichier ZIP..."
          # On zippe directement sans passer par du tar.gz
          zip -r GOANGEL_CACHE.zip cache/
          ls -lh GOANGEL_CACHE.zip

      - name: Upload sur GitHub (Artefact)
        uses: actions/upload-artifact@v4
        with:
          name: GOANGEL_CACHE_ARTIFACT
          path: GOANGEL_CACHE.zip
          retention-days: 14

      - name: Publication en Release (Téléchargement direct)
        uses: softprops/action-gh-release@v1
        with:
          files: GOANGEL_CACHE.zip
          name: "Cache GOANGEL ZIP - ${{ github.run_id }}"
          tag_name: "cache-zip-v${{ github.run_id }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
